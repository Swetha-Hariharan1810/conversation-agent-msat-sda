[project]
name = "msat-survey-agent"
version = "0.1.0"
description = "Outbound member satisfaction survey agent for the Allianz Smart Step program"
authors = [
    {name = "Swetha hariharan"}
]
requires-python = ">=3.13,<3.14"
dependencies = [
  "langchain-core>=1.4.7,<2.0.0",
  "langgraph>=1.1.0,<2.0.0",
  "langchain-openai>=1.2.0,<2.0.0",
  "pydantic>=2.0.0,<3.0.0",
  "python-dotenv>=1.2.2,<2.0.0",
  "langgraph-cli[inmem]>=0.2.0,<1.0.0",
  "httpx>=0.28.1,<1.0.0",
  "typing-extensions>=4.16.0,<5.0.0",
  "pydantic-settings>=2.6.0,<3.0.0",
  "pyyaml>=6.0.2,<7.0.0",
]

[dependency-groups]
dev = [
    "pytest>=9.1.1,<10.0.0",
    "pytest-asyncio>=1.4.0,<2.0.0",
    "deptry>=0.25.1,<1.0.0",
    "ruff>=0.13.0",
    "mypy>=1.18.0",
    "types-pyyaml>=6.0.12",
]

# The package must be installable for `langgraph dev` to load the graph: the
# server imports it by module path, and a relative import inside an uninstalled
# package fails with "attempted relative import with no known parent package".
[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

# Without this, setuptools' flat-layout autodiscovery treats data/, scripts/ and
# tests/ as packages and refuses to build. Only the runtime package ships.
[tool.setuptools.packages.find]
include = ["msat_flow*", "survey_agent*"]

# Survey definitions ship inside the package so an installed build (langgraph
# deploy, a container) finds them without depending on the working directory.
[tool.setuptools.package-data]
survey_agent = ["catalog/*/*.yaml"]

[tool.ruff]
force-exclude = true
line-length = 100

[tool.ruff.lint]
select = ["E", "F", "I", "B", "UP", "ASYNC"]

[tool.mypy]
python_version = "3.13"
strict = true
plugins = ["pydantic.mypy"]
packages = ["survey_agent"]

[tool.pytest.ini_options]
asyncio_mode = "auto"
testpaths = ["tests"]
# Everything under tests/live talks to a real provider and is skipped unless
# MSAT_LIVE_TESTS=1 — see tests/live/README.md. The marker is here so the whole
# set can be selected or excluded by name (`-m live`, `-m "not live"`) without
# anyone having to know which directory it lives in.
markers = [
  "live: sends real requests to the configured LLM provider; costs money and needs credentials",
]
