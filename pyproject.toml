[project]
name = "msat-survey-agent"
version = "0.1.0"
description = "Outbound member satisfaction survey agent for the Allianz Smart Step program"
authors = [
    {name = "Swetha hariharan"}
]
requires-python = ">=3.13,<3.14"
dependencies = [
  "langchain-core>=1.2.0,<1.3.0",
  "langgraph>=1.0.3,<1.1.0",
  "langchain-openai>=1.1.0,<1.2.0",
  "pydantic>=2.0.0,<3.0.0",
  "python-dotenv>=1.2.2",
  "langgraph-cli[inmem]>=0.2.0",
  "langgraph-api>=0.11.0",
  "httpx>=0.28.1",
  "typing-extensions>=4.16.0",
]

[project.optional-dependencies]
# pypdf is a test dependency, not a runtime one: tests/test_script_sources.py
# reads the source PDF's text layer and fails if the transcription has drifted
# from it. The agent itself never opens the document.
[dependency-groups]
dev = [
  "pytest>=8.0.0,<9.0.0",
  "pytest-asyncio>=0.23.0,<1.0.0",
  "pypdf>=6.0.0,<7.0.0",
  "deptry>=0.25.1",
]

# The package must be installable for `langgraph dev` to load the graph: the
# server imports it by module path, and a relative import inside an uninstalled
# package fails with "attempted relative import with no known parent package".
[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

# Without this, setuptools' flat-layout autodiscovery treats data/, scripts/ and
# tests/ as packages and refuses to build. Only the runtime package ships.
[tool.setuptools.packages.find]
include = ["msat_flow*"]

[tool.pytest.ini_options]
asyncio_mode = "auto"
testpaths = ["tests"]
